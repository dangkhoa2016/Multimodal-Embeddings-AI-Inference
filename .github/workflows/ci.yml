name: CI - API, contract and security checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Compile package (no GPUs)
        run: python -m compileall -q src modal_app.py modal_models.py
      - name: Lint source and tests
        run: ruff check src modal_app.py modal_models.py scripts tests
      - name: Run contract and subprocess-isolation tests
        run: pytest -q
      - name: Verify that no model weights or .env are tracked
        run: |
          ! git ls-files | grep -E '(^|/)(\.env|models|checkpoints)/|\.(safetensors|gguf|pth|pt)$'
