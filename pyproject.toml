[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-embeddings-ai-inference"
version = "1.0.0"
description = "Authenticated multimodal embedding inference API: Qwen3-VL-Embedding-8B and Tencent WeMM-Embedding-9B on two dedicated Modal L40S workers"
readme = {text = "Multimodal Embeddings AI Inference is an authenticated FastAPI service for image and text vector embeddings. It supports Qwen3-VL-Embedding-8B and Tencent WeMM-Embedding-9B using separately deployed Modal GPU workers.", content-type = "text/markdown"}
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn>=0.29,<1",
  "pydantic>=2.6,<3",
  "pillow>=10.2,<13",
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "httpx>=0.27,<1", "ruff>=0.8,<1", "redis>=6.4,<9", "fakeredis[lua]>=2.40,<3"]
modal = ["modal>=1.0,<3", "python-dotenv>=1.0,<2"]
distributed = ["redis>=6.4,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "core: embedding API, encoder adapters, retrieval and model routing",
  "security: authentication, quotas, concurrency and async recovery",
  "notebook: offline demo and benchmark notebook behavior",
  "publication: documentation, evidence and release integrity",
]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
